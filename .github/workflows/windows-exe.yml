name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - codex/dev
    paths:
      - 'MangaManager/**'
      - 'requirements.txt'
      - '.github/workflows/windows-exe.yml'

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build MangaManager.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name MangaManager `
            --paths MangaManager `
            --collect-all tkinterdnd2 `
            MangaManager/main.py

      - name: Copy documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/MangaManager/README.md -Force

      - name: Create release zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MangaManager/* -DestinationPath MangaManager-windows-x64.zip -Force

      - name: Upload executable folder
        uses: actions/upload-artifact@v4
        with:
          name: MangaManager-windows-x64-folder
          path: dist/MangaManager
          if-no-files-found: error

      - name: Upload zipped executable
        uses: actions/upload-artifact@v4
        with:
          name: MangaManager-windows-x64-zip
          path: MangaManager-windows-x64.zip
          if-no-files-found: error
